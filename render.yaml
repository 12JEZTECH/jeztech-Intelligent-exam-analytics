services:
  - type: web
    name: jeztech-intelligent-exam-analytics-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./jeztech.db
      - key: CORS_ORIGINS
        value: https://jeztech-intelligent-exam-analytics-d7lj.onrender.com
  - type: web
    name: jeztech-intelligent-exam-analytics
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://jeztech-intelligent-exam-analytics-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
