services:
  - type: web
    name: jeztech-intelligent-exam-analytics-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./jeztech.db
      - key: CORS_ORIGINS
        value: https://jeztech-intelligent-exam-analytics-d7lj.onrender.com
  - type: web
    name: jeztech-intelligent-exam-analytics
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://jeztech-intelligent-exam-analytics-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
